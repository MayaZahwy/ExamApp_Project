# Local stack: client + API gateway + microservices.
# Postgres is NOT included — use hosted Supabase via DATABASE_URL.
# Production: Vercel (client) → Render gateway → auth/exams/submissions → Supabase.

services:
  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL:-true}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    restart: unless-stopped

  exams:
    build:
      context: .
      dockerfile: services/exams/Dockerfile
    environment:
      PORT: 3002
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL:-true}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    restart: unless-stopped

  submissions:
    build:
      context: .
      dockerfile: services/submissions/Dockerfile
    environment:
      PORT: 3003
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL:-true}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports:
      - "${SERVER_PORT:-3000}:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      AUTH_SERVICE_URL: http://auth:3001
      EXAMS_SERVICE_URL: http://exams:3002
      SUBMISSIONS_SERVICE_URL: http://submissions:3003
    depends_on:
      - auth
      - exams
      - submissions
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        VITE_USE_MOCK_API: ${VITE_USE_MOCK_API:-false}
    ports:
      - "${CLIENT_PORT:-8080}:80"
    depends_on:
      - gateway
    restart: unless-stopped
